[project]
name = "photos-mcp"
version = "0.1.0"
description = "Unified Photos MCP app scaffold for Nanobot"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "numpy>=1.26",
    "imagehash>=4.3",
    "osxphotos>=0.68",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "pydantic>=2.0",
]

[project.optional-dependencies]
app = [
    "py2app>=0.28",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
photos-mcp = "photos_mcp.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/photos_mcp", "src/apple_terminal_helper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"