[project]
name = "photos-mcp"
version = "0.1.0"
description = "Unified Photos MCP app scaffold for Nanobot"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "numpy>=1.26",
    "imagehash>=4.3",
    "osxphotos>=0.68",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "pydantic>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
app = [
    "py2app>=0.28",
]
apple = [
    "photoscript",
    "wurlitzer>=3.0",
]
gcs = [
    "google-cloud-storage>=2.14",
]
google = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "requests>=2.31",
]
vlm = [
    "httpx>=0.27",
    "mlx-vlm>=0.1",
]
aesthetic = [
    "open-clip-torch>=2.24",
    "torch>=2.0",
]
face = [
    "mediapipe>=0.10",
]
face-identity = [
    "opencv-python-headless>=4.10",
]
face-legacy = [
    "face-recognition>=1.3",
]
review = [
    "fastapi>=0.115",
    "httpx>=0.27",
]
all = [
    "photos-mcp[app,apple,gcs,google,vlm,aesthetic,face,face-identity,face-legacy,review]",
    "mediapipe>=0.10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
photos-mcp = "photos_mcp.main:main"
photos-mcp-live-validate = "photos_mcp.live_validation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/photos_mcp", "src/apple_terminal_helper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
